name: Automated Tests & Quality Gates

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint, Typecheck, and Test Suite
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      NEXT_PUBLIC_SUPABASE_URL: https://mock-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.mock-anon-key
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.mock-service-role-key
      GROQ_API_KEY: gsk_mock_test_ci_key
      GROQ_MODEL: openai/gpt-oss-120b
      GROQ_FALLBACK_MODEL: openai/gpt-oss-20b

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: ESLint Code Quality
        run: npm run lint

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: Automated Unit & Integration Tests (Vitest)
        run: npm run test:coverage
